<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#193b35">
  <title>Espaço Bruna Alves — Gestão</title>
  <style>
    :root {
      --ink: #24332f;
      --muted: #87918d;
      --line: #e9ece8;
      --canvas: #f6f7f4;
      --paper: #ffffff;
      --theme-primary: #193b35;
      --theme-hover: #244a42;
      --theme-deep: #183a33;
      --theme-active: #2c5148;
      --theme-soft: #f3f6f2;
      --theme-soft-strong: #e9efe9;
      --theme-border: #b9c8be;
      --theme-ink: #263a33;
      --theme-rgb: 25, 59, 53;
      --forest: var(--theme-primary);
      --forest-2: var(--theme-hover);
      --sage: var(--theme-soft);
      --sage-ink: var(--theme-primary);
      --lavender: #f0edfa;
      --lavender-ink: #7666a3;
      --peach: #fbefe5;
      --peach-ink: #b97848;
      --blue: #edf3f8;
      --blue-ink: #617f9b;
      --rose: #f9eceb;
      --rose-ink: #b76a68;
      --gold: #d4b783;
      --shadow: 0 10px 30px rgba(30, 52, 45, .055);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; background: var(--canvas); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app-shell { min-height: 100vh; }
    .sidebar { width: 248px; position: fixed; inset: 0 auto 0 0; z-index: 20; display: flex; flex-direction: column; padding: 25px 16px 17px; background: var(--forest); color: #edf2ed; transition: transform .25s ease; }
    .brand { display:flex; align-items:center; gap: 11px; padding: 0 11px 28px; }
    .brand-mark { width: 37px; height: 37px; flex: none; display:grid; place-items:center; border:1px solid rgba(222,201,157,.5); border-radius: 12px; color: #e4d0a5; background: rgba(255,255,255,.045); }
    .brand-word { font-family: Georgia, "Times New Roman", serif; font-size: 16px; letter-spacing: -.25px; color:#fff; line-height:1.15; white-space:nowrap; }
    .brand-word span { color:#dcc89e; }
    .brand-caption { display:block; margin-top:5px; color:#9fb2a9; font-size:9.2px; font-weight:700; letter-spacing:1.65px; }
    .branch-switch { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 3px 25px; padding:11px 12px; border:1px solid rgba(255,255,255,.11); border-radius:12px; background:rgba(255,255,255,.055); color:#d9e4dd; font-size:12.7px; }
    .branch-meta { display:flex; align-items:center; gap:9px; min-width:0; }
    .branch-meta span:last-child { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .branch-pin { display:grid; place-items:center; width:25px;height:25px;border-radius:8px;background:rgba(215,193,148,.16);color:#e2ce9f; }
    .nav-section { margin:0 11px 9px; color:#829b90; font-size:10.4px; font-weight:750; text-transform:uppercase; letter-spacing:1.45px; }
    .nav-list { display:grid; gap:4px; margin-bottom:24px; }
    .nav-link { width:100%; border:0; display:flex; align-items:center; gap:12px; padding:11px 12px; color:#bccbc3; background:transparent; text-align:left; border-radius:10px; font-size:13.8px; font-weight:550; transition:background .18s, color .18s; }
    .nav-link svg { width:17px;height:17px; opacity:.92; flex:none; }
    .nav-link:hover { color:#fff; background:rgba(255,255,255,.07); }
    .nav-link.active { color:#fff; background:#2c5148; box-shadow:inset 2px 0 #d9c69b; }
    .nav-link .nav-badge { margin-left:auto; min-width:21px; height:20px; display:grid; place-items:center; padding:0 5px; border-radius:7px; color:#d7e8de; background:rgba(255,255,255,.10); font-size:11.5px; }
    .nav-link .nav-status { margin-left:auto; color:#aec0b5; font-size:8px; font-weight:650; letter-spacing:.1px; white-space:nowrap; }
    .sidebar-spacer { flex:1; }
    .sidebar-help { display:flex; gap:10px; align-items:center; margin:0 4px 16px; padding:13px; border-radius:12px; color:#b8c9c0; background:rgba(255,255,255,.055); }
    .sidebar-help svg { color:#dfc99a; flex:none; }
    .sidebar-help strong { display:block; color:#e6eee9; font-size:11.5px; font-weight:650; }
    .sidebar-help small { display:block; margin-top:3px; color:#8fa69a; font-size:10.4px; }
    .sidebar-user { display:flex; align-items:center; gap:10px; padding:15px 7px 0; border-top:1px solid rgba(255,255,255,.1); }
    .avatar { display:grid; place-items:center; flex:none; width:35px;height:35px;border-radius:12px; color:#6d786a; background:#e5e8dc; font-size:12.7px;font-weight:750; }
    .sidebar-user .avatar { width:34px;height:34px;background:#d9c9a6;color:#31453e; }
    .user-details { min-width:0; flex:1; }
    .user-details strong { display:block; color:#f2f5f1; font-size:12.7px; font-weight:650; }
    .user-details span { display:block; margin-top:3px; color:#96aca0; font-size:10.4px; }
    .main-area { min-height:100vh; margin-left:248px; }
    .topbar { position:sticky; top:0; z-index:15; height:70px; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:0 34px; border-bottom:1px solid #e9ece8; background:rgba(255,255,255,.94); backdrop-filter:blur(12px); }
    .topbar-left { display:flex; align-items:center; gap:14px; min-width:160px; }
    .breadcrumb { color:#a0aaa5; font-size:10.4px; font-weight:750; letter-spacing:1.2px; text-transform:uppercase; }
    .breadcrumb b { color:#3d5148; font-weight:750; }
    .mobile-menu { display:none; border:0; background:none; color:var(--ink); padding:5px; }
    .topbar-actions { display:flex; align-items:center; gap:11px; }
    .global-search { position:relative; width:min(260px, 25vw); }
    .global-search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#9aa59f; }
    .global-search input { width:100%; height:37px; padding:0 38px 0 36px; border:1px solid #edf0ec; outline:0; border-radius:11px; background:#f8f9f7; color:var(--ink); font-size:12.7px; transition:border .2s, background .2s; }
    .global-search input:focus { border-color:#b9c8be; background:#fff; }
    .search-shortcut { position:absolute; right:9px; top:9px; padding:2px 5px; border:1px solid #e5e9e5; border-radius:5px; color:#a6afaa; font-size:10.4px; }
    .icon-button { position:relative; width:36px;height:36px;display:grid;place-items:center;border:1px solid #eef0ed;border-radius:11px;background:#fff;color:#687771; }
    .icon-button:hover { background:#f8faf8; color:var(--forest); }
    .notification-dot { position:absolute; right:8px; top:8px; width:6px;height:6px;border:1px solid #fff;border-radius:50%;background:#d78270; }
    .role-wrap { position:relative; }
    .role-button { display:flex; align-items:center; gap:8px; padding:4px 0 4px 7px; border:0; background:transparent; color:var(--ink); text-align:left; }
    .role-button .avatar { width:34px;height:34px; }
    .role-name { display:block; font-size:11.5px;font-weight:700; }
    .role-label { display:block; margin-top:3px; color:#929d97; font-size:10.4px; }
    .role-menu { position:absolute; top:46px; right:0; z-index:30; width:192px; padding:6px; border:1px solid #e8ece8; border-radius:13px; background:#fff; box-shadow:0 15px 35px rgba(25,59,53,.16); }
    .role-menu[hidden] { display:none; }
    .role-menu p { margin:7px 9px 5px; color:#9aa49f; font-size:10.4px; font-weight:750; letter-spacing:1px; text-transform:uppercase; }
    .role-option { display:flex; width:100%; align-items:center; gap:9px; padding:9px; border:0; border-radius:8px; background:#fff; color:#53615b; text-align:left; font-size:12.7px; }
    .role-option:hover, .role-option.selected { color:var(--forest); background:#f3f6f2; }
    .role-option span { display:grid;place-items:center;width:23px;height:23px;border-radius:8px;background:#e9efe9;color:#5d7b65; }
    .content { max-width:1500px; margin:0 auto; padding:30px 34px 48px; }
    .page-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:24px; }
    .eyebrow { display:flex; align-items:center; gap:7px; color:#7e9287; font-size:10.4px; font-weight:760; letter-spacing:1.25px; text-transform:uppercase; }
    .eyebrow .eyebrow-dot { width:5px;height:5px;border-radius:50%;background:#c4a973; }
    h1 { margin:7px 0 0; color:#263a33; font-family:Georgia, "Times New Roman", serif; font-size:30px; font-weight:500; letter-spacing:-.55px; }
    .page-subtitle { margin:7px 0 0; color:#8d9892; font-size:12.7px; }
    .heading-actions { display:flex; align-items:center; gap:8px; flex:none; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:38px; padding:0 14px; border:1px solid #e5eae5; border-radius:10px; color:#53635a; background:#fff; font-size:11.5px; font-weight:650; transition:all .18s; }
    .btn:hover { border-color:#ccd7cd; background:#fafcf9; }
    .btn-primary { border-color:var(--forest); background:var(--forest); color:#fff; box-shadow:0 4px 10px rgba(25,59,53,.12); }
    .btn-primary:hover { border-color:#244a42; background:#244a42; }
    .btn-soft { border-color:#e7eee8; background:#f3f7f2; color:#4a6854; }
    .btn-danger { border-color:#f0dfdc; background:#fff8f7; color:#a45b55; }
    .btn-sm { min-height:32px; padding:0 11px; border-radius:9px; font-size:10.4px; }
    .btn-icon { width:33px; min-height:33px; padding:0; }
    .metric-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:13px; margin-bottom:19px; }
    .metric-card { min-height:111px; padding:17px 18px; border:1px solid #e9ede9; border-radius:15px; background:#fff; box-shadow:0 2px 8px rgba(36,51,47,.018); }
    .metric-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .metric-label { color:#839089; font-size:11.5px; font-weight:570; }
    .metric-icon { width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:#eff4ef;color:#62816a; }
    .metric-icon.peach { background:#fcf1e8;color:#b87b4e; }
    .metric-icon.lavender { background:#f1eff8;color:#8172a5; }
    .metric-icon.blue { background:#edf3f7;color:#66839c; }
    .metric-value { margin-top:12px; color:#30413a; font-size:22px; font-weight:690; letter-spacing:-.7px; }
    .metric-foot { display:flex; align-items:center; gap:5px; margin-top:5px; color:#9aa39e; font-size:10.4px; }
    .trend-up { color:#6c9472; font-weight:700; }
    .dashboard-grid { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(255px,.85fr); gap:17px; align-items:start; }
    .card { border:1px solid #e8ece8; border-radius:var(--radius); background:#fff; box-shadow:0 2px 8px rgba(36,51,47,.018); }
    .card-header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:17px 19px; border-bottom:1px solid #f0f2ef; }
    .card-title { color:#34453d; font-size:13.8px; font-weight:700; }
    .card-subtitle { margin-top:4px; color:#99a39e; font-size:10.4px; }
    .text-button { display:inline-flex; align-items:center; gap:5px; border:0; background:none; color:#6c8674; font-size:10.4px; font-weight:700; }
    .text-button:hover { color:#355f49; }
    .calendar-toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; border-bottom:1px solid #f0f2ef; }
    .calendar-nav { display:flex; align-items:center; gap:7px; }
    .date-main { margin-left:4px; color:#3d5046; font-size:12.7px; font-weight:700; }
    .view-switch { display:flex; padding:3px; border:1px solid #edf0ed; border-radius:9px; background:#f7f8f6; }
    .view-switch button { padding:6px 10px; border:0; border-radius:7px; background:transparent; color:#929d96; font-size:10.4px; font-weight:650; }
    .view-switch button.active { color:#45634d; background:#fff; box-shadow:0 1px 4px rgba(40,55,46,.1); }
    .filter-select { height:32px; padding:0 27px 0 10px; border:1px solid #edf0ed; border-radius:9px; outline:0; background:#fff; color:#68766e; font-size:10.4px; }
    .calendar-legend { display:flex; align-items:center; gap:13px; padding:12px 19px 3px; color:#9aa49e; font-size:9.2px; }
    .legend-item { display:inline-flex; align-items:center; gap:5px; }
    .legend-dot { width:6px;height:6px;border-radius:50%;background:#8eae91; }
    .legend-dot.in-service { background:#d39b72; }
    .legend-dot.scheduled { background:#83a0b4; }
    .legend-dot.done { background:#b2b8b2; }
    .agenda-list { padding:7px 16px 12px; }
    .week-grid { display:grid; grid-template-columns:repeat(5,minmax(118px,1fr)); gap:9px; overflow-x:auto; padding:14px; }
    .week-day { min-width:118px; padding:10px 9px; border:1px solid #edf0ed; border-radius:11px; background:#fbfcfb; }
    .week-day-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; color:#829088; font-size:9.2px; font-weight:750; text-transform:uppercase; letter-spacing:.6px; }
    .week-day-head strong { display:grid; place-items:center; width:25px;height:25px;border-radius:8px;background:#edf3ed;color:#4d6c53;font-size:11.5px; }
    .week-appointment { display:block; width:100%; margin:6px 0; padding:8px; border:1px solid #e6eee6; border-left:3px solid #8eae91; border-radius:8px; background:#fff; text-align:left; cursor:pointer; }
    .week-appointment:hover { border-color:#c8d9ca; box-shadow:0 3px 9px rgba(35,63,49,.07); }
    .week-appointment.service { border-left-color:#d39b72; background:#fffdfb; }
    .week-appointment.scheduled { border-left-color:#83a0b4; }
    .week-appointment.done { border-left-color:#b7beb8; }
    .week-appointment time { display:block; margin-bottom:5px; color:#718077; font-size:9.2px; font-weight:750; }
    .week-appointment strong { display:block; overflow:hidden; color:#405148; font-size:9.2px; white-space:nowrap; text-overflow:ellipsis; }
    .week-appointment small { display:block; overflow:hidden; margin-top:4px; color:#9aa49e; font-size:8px; white-space:nowrap; text-overflow:ellipsis; }
    .kanban-intro { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 17px 0; color:#738279; font-size:10.4px; }
    .kanban-intro strong { color:#53665b; font-weight:700; }
    .kanban-intro span { color:#9aa49e; font-size:9.2px; }
    .kanban-board { display:flex; align-items:stretch; gap:10px; min-height:400px; overflow-x:auto; padding:13px 14px 18px; scrollbar-color:#c8d5ca #f4f6f3; scrollbar-width:thin; }
    .kanban-lane { flex:0 0 174px; min-height:375px; overflow:hidden; border:1px solid #e8ede8; border-radius:12px; background:#f9fbf9; scroll-snap-align:start; }
    .kanban-lane.queue-lane { flex-basis:218px; border-color:#ebe4d6; background:#fbf9f4; }
    .kanban-lane-head { position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:11px 11px; border-bottom:1px solid #e9eee9; background:rgba(255,255,255,.92); }
    .queue-lane .kanban-lane-head { border-color:#eee7d9; background:rgba(255,255,255,.78); }
    .kanban-lane-head strong { color:#4c5e53; font-size:11.5px; }
    .kanban-lane-head small { color:#9da8a1; font-size:9.2px; }
    .kanban-count { display:grid; place-items:center; min-width:20px; height:20px; padding:0 5px; border-radius:7px; background:#edf3ed; color:#67826c; font-size:9.2px; font-weight:750; }
    .queue-lane .kanban-count { background:#f4ecdb; color:#a2824e; }
    .kanban-dropzone { display:grid; align-content:start; gap:8px; min-height:320px; padding:9px; border:1px dashed transparent; border-radius:10px; transition:background .16s,border-color .16s; }
    .kanban-dropzone.drag-over { border-color:#7fa183; background:#edf5ed; }
    .kanban-empty-slot { display:grid; place-items:center; min-height:57px; padding:9px; border:1px dashed #dce5dd; border-radius:10px; color:#a0aaa3; font-size:9.2px; text-align:center; }
    .kanban-card { display:block; width:100%; padding:10px; border:1px solid #e6ece6; border-left:3px solid #87a88a; border-radius:10px; background:#fff; color:#45564c; text-align:left; cursor:grab; box-shadow:0 2px 5px rgba(40,58,45,.025); transition:transform .16s,box-shadow .16s,border-color .16s; }
    .kanban-card:hover { transform:translateY(-1px); border-color:#cfded0; box-shadow:0 5px 12px rgba(35,63,49,.07); }
    .kanban-card:active { cursor:grabbing; }
    .kanban-card.selected { border-color:#6d9271; box-shadow:0 0 0 3px rgba(109,146,113,.16); }
    .kanban-card.in-service { border-left-color:#d39b72; background:#fffdfa; }
    .kanban-card.done { border-left-color:#b7beb8; opacity:.78; }
    .kanban-card-head { display:flex; align-items:center; justify-content:space-between; gap:5px; margin-bottom:8px; }
    .kanban-card-time { color:#62806a; font-size:9.2px; font-weight:750; }
    .kanban-card-state { padding:3px 5px; border-radius:5px; background:#f0f4ef; color:#76867a; font-size:8px; white-space:nowrap; }
    .kanban-card strong { display:block; color:#3d5145; font-size:10.4px; line-height:1.35; }
    .kanban-card small { display:block; overflow:hidden; margin-top:4px; color:#929e96; font-size:9.2px; line-height:1.35; text-overflow:ellipsis; }
    .kanban-card-foot { display:flex; align-items:center; justify-content:space-between; gap:5px; margin-top:9px; padding-top:7px; border-top:1px solid #f0f2ef; color:#8b9890; font-size:8px; }
    .kanban-card-foot em { color:#7b927e; font-style:normal; font-weight:700; }
    .queue-lane .kanban-card { border-left-color:#cfb37e; }
    .kanban-queue-empty { padding:22px 12px; color:#a39a86; font-size:9.2px; line-height:1.5; text-align:center; }
    .appointment-row { display:grid; grid-template-columns:54px minmax(0,1fr); gap:9px; align-items:stretch; min-height:67px; padding:6px 0; cursor:pointer; }
    .time-label { padding-top:12px; color:#738179; font-size:11.5px; font-weight:700; text-align:right; }
    .time-label small { display:block; margin-top:3px; color:#a7b0aa; font-size:9.2px; font-weight:500; }
    .appointment-card { position:relative; display:flex; align-items:center; gap:11px; min-width:0; padding:10px 12px; border:1px solid #edf1ed; border-left:3px solid #8eae91; border-radius:11px; background:#fbfcfb; transition:transform .18s, box-shadow .18s, border-color .18s; }
    .appointment-row:hover .appointment-card { transform:translateY(-1px); border-color:#d9e5da; box-shadow:0 5px 12px rgba(35,63,49,.06); }
    .appointment-card.status-service { border-left-color:#d39b72; background:#fffdfb; }
    .appointment-card.status-scheduled { border-left-color:#83a0b4; }
    .appointment-card.status-done { border-left-color:#b7beb8; background:#fafbfa; }
    .client-avatar { width:34px;height:34px;display:grid;place-items:center;flex:none;border-radius:11px;background:#e7ede6;color:#55705b;font-size:10.4px;font-weight:750; }
    .client-avatar.tone-2 { background:#f5e8df;color:#aa7653; }
    .client-avatar.tone-3 { background:#ece9f5;color:#7b6d9a; }
    .client-avatar.tone-4 { background:#e5edf2;color:#5b7a91; }
    .appt-main { min-width:0; flex:1; }
    .appt-client { overflow:hidden; color:#35463e; font-size:11.5px; font-weight:700; white-space:nowrap; text-overflow:ellipsis; }
    .appt-service { overflow:hidden; margin-top:4px; color:#929d96; font-size:10.4px; white-space:nowrap; text-overflow:ellipsis; }
    .appt-professional { min-width:90px; color:#77857d; font-size:10.4px; text-align:right; }
    .status-pill { display:inline-flex; align-items:center; gap:5px; padding:5px 7px; border-radius:7px; background:#edf4ed; color:#648269; font-size:9.2px; font-weight:700; white-space:nowrap; }
    .status-pill::before { width:5px;height:5px;border-radius:50%;background:currentColor;content:""; }
    .status-pill.service { background:#fcf1e9;color:#b67e54; }
    .status-pill.scheduled { background:#edf3f7;color:#6b879b; }
    .status-pill.done { background:#f0f2ef;color:#858e87; }
    .status-pill.noshow { background:#faeceb;color:#b26865; }
    .side-stack { display:grid; gap:15px; }
    .next-card { padding:18px; background:linear-gradient(145deg,#23473e,#183a33); color:#fff; border:0; overflow:hidden; position:relative; }
    .next-card::after { content:""; position:absolute; width:150px;height:150px; right:-52px;top:-67px;border:1px solid rgba(226,207,165,.16);border-radius:50%;box-shadow:0 0 0 19px rgba(255,255,255,.018),0 0 0 40px rgba(255,255,255,.018); }
    .next-card .card-title { color:#eef4ef; }
    .next-card .card-subtitle { color:#a9c0b3; }
    .next-time { display:flex; align-items:baseline; gap:7px; margin:20px 0 12px; }

  function renderWeekCalendar(list){

  function friendlyError(error,fallback='Não foi possível concluir a operação.'){
    const message=String(error?.message||error||'');
    if(/invalid login credentials/i.test(message))return 'E-mail ou senha incorretos.';
    if(/email not confirmed/i.test(message))return 'Confirme seu e-mail antes de entrar.';
    if(/user already registered|already been registered/i.test(message))return 'Este e-mail já possui uma conta. Tente entrar.';
    if(/weak password|password.{0,30}(least|characters|short)/i.test(message))return 'A senha não atende aos requisitos de segurança. Use pelo menos 8 caracteres.';
    if(/same password|different from the old/i.test(message))return 'Escolha uma senha diferente da anterior.';
    if(/rate limit|too many requests|email rate/i.test(message))return 'Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente novamente.';
    if(/update_business_theme|schema cache.*function|function.*not found/i.test(message))return 'A personalização de cores ainda não foi ativada no Supabase.';
    if(/cor.*formato|theme.*color.*check/i.test(message))return 'Escolha uma cor válida no formato hexadecimal.';
    if(/42501|row-level security|permission denied|sem permissão/i.test(message))return 'Sua conta não tem permissão para esta ação nesta unidade.';
    if(/23505|duplicate key|already exists/i.test(message))return 'Já existe um registro com esses dados.';
    if(/23P01|exclusion|conflit|overlap|horário bloqueado/i.test(message))return 'Este horário está ocupado ou bloqueado. Escolha outro.';
    if(/22007|precisa ser futuro|horário.*futuro/i.test(message))return 'Escolha um horário futuro.';
    return message||fallback;
  }

  async function handleKanbanDrop(type,id,time){
    if(state.role==='Profissional'){toast('Somente recepção e administração podem alterar a agenda.');return;}
    if(!/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(time)||timeToMinutes(time)<480||timeToMinutes(time)>=1080){toast('Escolha um horário entre 08:00 e 17:00.');return;}
    if(type==='waitlist'){openKanbanScheduleModal(id,time);return;}
    const appointment=state.appointments.find(item=>item.id===Number(id));if(!appointment)return;
    if(['Finalizado','Faltou','Cancelado'].includes(appointment.status)){toast('Atendimentos encerrados não podem ser movidos.');return;}
    const live=state.supabaseMode&&state.authenticated;const siblings=live?state.appointments.filter(item=>item.backendId===appointment.backendId):[appointment];
    const delta=timeToMinutes(time)-timeToMinutes(appointment.time);const duration=Math.max(15,timeToMinutes(appointment.end)-timeToMinutes(appointment.time));const newEnd=timeToMinutes(time)+duration;
    const lastEnd=live?Math.max(...siblings.map(item=>timeToMinutes(item.end)+delta)):newEnd;
    if(lastEnd>1080){toast('O atendimento ultrapassaria o horário de fechamento às 18:00.');return;}
    const collision=live?siblings.some(moving=>state.appointments.some(other=>other.backendId!==appointment.backendId&&other.professionalBackendId===moving.professionalBackendId&&!['Finalizado','Faltou','Cancelado'].includes(other.status)&&timeToMinutes(moving.time)+delta<timeToMinutes(other.end)&&timeToMinutes(moving.end)+delta>timeToMinutes(other.time))):state.appointments.some(other=>other.id!==appointment.id&&other.professional===appointment.professional&&!['Finalizado','Faltou','Cancelado'].includes(other.status)&&timeToMinutes(time)<timeToMinutes(other.end)&&newEnd>timeToMinutes(other.time));
    if(collision){toast(`Conflito: ${appointment.professional} já tem um atendimento nesse intervalo.`);return;}
    const oldTime=appointment.time;
    if(live){
      const first=siblings.slice().sort((a,b)=>a.time.localeCompare(b.time))[0];const newFirst=minutesToTime(timeToMinutes(first.time)+delta);
      const {error}=await supabaseClient.rpc('move_appointment',{p_appointment_id:appointment.backendId,p_new_starts_at:zonedDateTimeToIso(dateKeyInZone(state.date),newFirst)});
      if(error){toast(friendlyError(error,'Não foi possível reagendar o atendimento.'));return;}
      state.kanbanSelected=null;await refreshAgenda();toast(`${appointment.client} reagendada de ${oldTime} para ${time}.`);return;
    }
    appointment.time=time;appointment.end=minutesToTime(newEnd);state.kanbanSelected=null;render();toast(`${appointment.client} reagendada de ${oldTime} para ${time}.`);
  }

      const collision=sameDay&&state.appointments.some(other=>other.professional===professional.name&&!['Finalizado','Faltou','Cancelado'].includes(other.status)&&start<timeToMinutes(other.end)&&end>timeToMinutes(other.time));
      if(collision){showFormError(form,`Conflito: ${professional.name} já tem um atendimento nesse intervalo.`);return;}
      state.date=new Date(`${dateValue}T12:00:00`);state.appointments.push({id:Date.now(),time,end:minutesToTime(end),client:client.name,service:service.name,professional:professional.name,status:'Agendado',amount:service.price,initials:client.initials,tone:client.tone,notes:String(data.get('notes')||'')});closeModal();state.page='agenda';render();toast('Agendamento criado com sucesso.');return;
    }
    if(e.target.id==='clientForm'){
      const form=e.target;const data=new FormData(form);const name=String(data.get('name')||'').trim();const rawPhone=String(data.get('phone')||'').trim();const live=state.supabaseMode&&state.authenticated;
      if(live){
        const phone=normalizeBrazilPhone(rawPhone);if(!phone){showFormError(form,'Informe um telefone brasileiro com DDD (10 ou 11 dígitos).');return;}
        const {error}=await supabaseClient.from('clients').insert({business_id:state.businessId,name,phone_e164:phone,email:String(data.get('email')||'').trim()||null,birth_date:String(data.get('birthday')||'')||null,notes:String(data.get('notes')||'').trim()||null,marketing_opt_in:false});
        if(error){showFormError(form,friendlyError(error,'Não foi possível salvar a cliente.'));return;}
        closeModal();state.page='clientes';state.clientQuery='';await refreshAgenda();toast(`${name} foi adicionada à sua base.`);return;
      }
      state.clients.unshift({id:Date.now(),name,phone:rawPhone,email:String(data.get('email')||'—'),last:'Ainda sem atendimentos',lastDate:'—',next:'—',tag:'Nova cliente',initials:initials(name),tone:1,allergy:'Nenhuma informada',formula:'—',visits:0});closeModal();state.page='clientes';state.clientQuery='';render();toast(`${name} foi adicionada à sua base.`);return;
    }
    if(state.managementPreview&&['productForm','stockMovementForm','expenseForm','commissionRuleForm','commissionPayoutForm'].includes(e.target.id)){closeModal();toast('Prévia local: o formulário foi validado, sem gravar no Supabase.');return;}
    if(e.target.id==='productForm'){
      const form=e.target;const data=new FormData(form);const salePrice=String(data.get('salePrice')||'').trim();setFormBusy(form,true);
      try{
        const {error}=await supabaseClient.rpc('create_inventory_product',{p_branch_id:state.branchId,p_name:String(data.get('name')||'').trim(),p_sku:String(data.get('sku')||'').trim(),p_product_type:String(data.get('productType')||'internal'),p_unit:String(data.get('unit')||'').trim(),p_minimum_stock:Number(data.get('minimumStock')||0),p_cost_price:Number(data.get('costPrice')||0),p_sale_price:salePrice===''?null:Number(salePrice),p_initial_quantity:Number(data.get('initialQuantity')||0)});
        if(error){showFormError(form,friendlyError(error,'Não foi possível cadastrar o produto.'));return;}
        closeModal();state.page='estoque';await refreshManagementData();toast('Produto cadastrado e saldo inicial registrado.');return;
      }catch(error){showFormError(form,friendlyError(error,'Não foi possível cadastrar o produto.'));return;}finally{if(document.body.contains(form))setFormBusy(form,false);}
    }
    if(e.target.id==='stockMovementForm'){
      const form=e.target;const data=new FormData(form);const rawType=String(data.get('movementType')||'');const quantity=Number(data.get('quantity')||0);const outgoing=['consumption','loss','adjustment_out'].includes(rawType);const movementType=rawType.startsWith('adjustment_')?'adjustment':rawType;const costRaw=String(data.get('unitCost')||'').trim();setFormBusy(form,true);
      try{
        const {error}=await supabaseClient.rpc('record_stock_movement',{p_branch_id:state.branchId,p_product_id:String(data.get('productId')||''),p_movement_type:movementType,p_quantity_delta:outgoing?-Math.abs(quantity):Math.abs(quantity),p_unit_cost:costRaw===''?null:Number(costRaw),p_reason:String(data.get('reason')||'').trim()||null});
        if(error){showFormError(form,friendlyError(error,'Não foi possível registrar a movimentação.'));return;}
        closeModal();state.page='estoque';await refreshManagementData();toast('Movimentação registrada e saldo atualizado.');return;
      }catch(error){showFormError(form,friendlyError(error,'Não foi possível registrar a movimentação.'));return;}finally{if(document.body.contains(form))setFormBusy(form,false);}
    }
    if(e.target.id==='expenseForm'){
      const form=e.target;const data=new FormData(form);const paidAt=String(data.get('paidAt')||'');setFormBusy(form,true);
      try{
        const {error}=await supabaseClient.rpc('record_expense',{p_branch_id:state.branchId,p_description:String(data.get('description')||'').trim(),p_category:String(data.get('category')||'').trim(),p_amount:Number(data.get('amount')||0),p_payment_method:String(data.get('paymentMethod')||''),p_paid_at:zonedDateTimeToIso(paidAt.slice(0,10),paidAt.slice(11,16)),p_notes:String(data.get('notes')||'').trim()||null});
        if(error){showFormError(form,friendlyError(error,'Não foi possível registrar a despesa.'));return;}
        closeModal();state.page='financeiro';await refreshManagementData();toast('Despesa registrada no financeiro.');return;
      }catch(error){showFormError(form,friendlyError(error,'Confira a data e os valores informados.'));return;}finally{if(document.body.contains(form))setFormBusy(form,false);}
    }
    if(e.target.id==='commissionRuleForm'){
      const form=e.target;const data=new FormData(form);setFormBusy(form,true);
      try{
        const {error}=await supabaseClient.rpc('upsert_commission_rule',{p_service_id:String(data.get('serviceId')||''),p_professional_id:String(data.get('professionalId')||'')||null,p_rule_type:String(data.get('ruleType')||'percent'),p_value:Number(data.get('value')||0)});
        if(error){showFormError(form,friendlyError(error,'Não foi possível salvar a regra.'));return;}
        closeModal();state.page='comissoes';await refreshManagementData();toast('Regra de comissão atualizada.');return;
      }catch(error){showFormError(form,friendlyError(error,'Não foi possível salvar a regra.'));return;}finally{if(document.body.contains(form))setFormBusy(form,false);}
    }
    if(e.target.id==='commissionPayoutForm'){
      const form=e.target;const data=new FormData(form);const professionalId=String(data.get('professionalId')||'');const entryIds=state.commissionEntries.filter(item=>item.status==='pending'&&item.professional_id===professionalId).map(item=>item.id);setFormBusy(form,true);
      try{
        const {error}=await supabaseClient.rpc('pay_commissions',{p_branch_id:state.branchId,p_professional_id:professionalId,p_entry_ids:entryIds,p_payment_method:String(data.get('paymentMethod')||'pix'),p_notes:String(data.get('notes')||'').trim()||null});
        if(error){showFormError(form,friendlyError(error,'Não foi possível registrar o repasse.'));return;}
        closeModal();state.page='comissoes';await refreshManagementData();toast('Repasse registrado e comissões quitadas.');return;
      }catch(error){showFormError(form,friendlyError(error,'Não foi possível registrar o repasse.'));return;}finally{if(document.body.contains(form))setFormBusy(form,false);}
    }
    if(e.target.id==='checkoutForm'){
      const form=e.target;const total=Number(form.dataset.total)||0;const rows=[...form.querySelectorAll('.payment-row')];const payments=rows.map(row=>({method:row.querySelector('.payment-method').value,amount:Number(row.querySelector('.payment-amount').value)||0}));const sum=payments.reduce((value,item)=>value+item.amount,0);if(Math.abs(sum-total)>.009||payments.some(item=>item.amount<=0)){document.getElementById('paymentError').classList.add('show');return;}
      if(form.dataset.live==='true'){
        const data=new FormData(form);setFormBusy(form,true);
        try{
          const {error}=await supabaseClient.rpc('close_appointment_checkout',{p_appointment_id:form.dataset.appointmentId,p_discount:Number(data.get('discount')||0),p_payments:payments,p_notes:String(data.get('notes')||'').trim()||null});
          if(error){showFormError(form,friendlyError(error,'Não foi possível fechar a comanda.'));return;}
          closeModal();await Promise.all([loadSupabaseAgenda(),loadManagementData()]);render();toast(`Comanda de ${money(total)} fechada. Financeiro e comissões atualizados.`);return;
        }catch(error){if(document.body.contains(form))showFormError(form,friendlyError(error,'Não foi possível fechar a comanda.'));else{render();toast('Comanda fechada; atualize a agenda para recarregar os dados.');}return;}finally{if(document.body.contains(form))setFormBusy(form,false);}
      }
      const appt=state.appointments.find(x=>x.id===state.selectedAppointment);if(appt)appt.status='Finalizado';closeModal();render();toast(`Comanda de ${money(total)} fechada. Comissão e caixa atualizados.`);return;
    }
    if(e.target.id==='payoutForm'){closeModal();toast('Repasse registrado no extrato do profissional.');return;}
    if(e.target.id==='stockForm'){closeModal();toast('Movimentação de estoque registrada.');return;}
  });
  function updatePaymentSummary(){
    const form=document.getElementById('checkoutForm');if(!form)return;const total=Number(form.dataset.total)||0;const sum=[...document.querySelectorAll('.payment-amount')].reduce((s,i)=>s+(Number(i.value)||0),0);const node=document.getElementById('paymentSum');if(node)node.textContent=money(sum);const error=document.getElementById('paymentError');if(error&&Math.abs(sum-total)<=.009)error.classList.remove('show');
  }
  bootApplication();
</script>
</body>
</html>
